<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CryptoAudit 🔍 — Live Demo</title>
<script src="https://cdn.jsdelivr.net/pyodide/v0.27.6/full/pyodide.js"></script>
<style>
  body { background:#0d1117; color:#e6edf3; font-family:monospace; margin:0; padding:16px; }
  h1 { font-size:20px; }
  textarea { width:100%; height:200px; background:#161b22; color:#e6edf3; border:1px solid #30363d; border-radius:8px; padding:10px; font-family:monospace; font-size:13px; box-sizing:border-box; }
  button { background:#238636; color:#fff; border:0; padding:12px 20px; border-radius:6px; font-size:15px; margin-top:8px; }
  #status { color:#8b949e; margin:8px 0; }
  #out { background:#161b22; padding:12px; border-radius:8px; white-space:pre-wrap; word-break:break-word; font-size:13px; margin-top:12px; display:none; }
  .hint { color:#8b949e; font-size:12px; }
</style>
</head>
<body>
<h1>🔍 CryptoAudit — Live Demo</h1>
<div class="hint">Вставь Python крипто-код → получи отчёт. / Paste Python crypto code → get a report.</div>
<div id="status">⏳ Loading… / Загрузка…</div>
<textarea id="code" placeholder="import hashlib&#10;key = b&quot;supersecret123&quot;&#10;nonce = b&quot;000000000000&quot;"></textarea>
<button id="run" disabled>🔍 Audit</button>
<pre id="out"></pre>
<script>
const status = document.getElementById("status");
const out = document.getElementById("out");
async function main() {
  try {
    const pyodide = await loadPyodide();
    const resp = await fetch("https://raw.githubusercontent.com/Julia7856/crypto-audit/main/auditor.py");
    if (!resp.ok) { status.textContent = "⚠️ fetch auditor.py failed"; return; }
    const src = await resp.text();
    pyodide.globals.set("auditor_src", src);
    await pyodide.runPythonAsync(`
import types, sys
mod = types.ModuleType("auditor")
exec(compile(auditor_src, "auditor.py", "exec"), mod.__dict__)
sys.modules["auditor"] = mod
`);
    window.py = pyodide;
    status.textContent = "✅ Ready / Готово!";
    document.getElementById("run").disabled = false;
  } catch (e) {
    status.textContent = "❌ " + (e.message || e);
  }
}
document.getElementById("run").onclick = async () => {
  const code = document.getElementById("code").value;
  window.py.globals.set("user_code", code);
  try {
    const rep = await window.py.runPythonAsync(`
import auditor
auditor.report(user_code)
`);
    out.style.display = "block";
    out.textContent = rep;
  } catch (e) {
    out.style.display = "block";
    out.textContent = "❌ " + (e.message || e);
  }
};
main();
</script>
</body>
</html>
